# Catppuccin Mocha + Nerd Font / Powerline symbols.
# Pair with JetBrainsMono Nerd Font in Kitty.

"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 500
palette = "catppuccin_mocha"

format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$docker_context\
$cmd_duration\
$line_break\
$character\
"""

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold teal"
format = "[$path]($style) "

[git_branch]
symbol = "git "
format = "[$symbol$branch]($style) "
style = "bold mauve"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold yellow"
conflicted = "x"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
untracked = "?"
modified = "!"
staged = "+"
renamed = ">"
deleted = "x"

[python]
symbol = "py "
format = "[${symbol}${version}]($style) "
style = "yellow"
python_binary = ["python3", "python"]

[nodejs]
symbol = "node "
format = "[${symbol}${version}]($style) "
style = "green"

[docker_context]
symbol = "docker "
format = "[${symbol}$context]($style) "
style = "blue"
only_with_files = true

[cmd_duration]
min_time = 500
format = "[took $duration]($style) "
style = "peach"
