# Two-line prompt. Starship is the ONLY prompt engine.
# Colours from theme/palette.env (do not invent new hex values).

"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 400
scan_timeout = 30

format = """
[╭─](bold #88C0D0) $username$hostname $directory$git_branch$git_status$python$nodejs$rust$docker_context$kubernetes$cmd_duration
[╰─](bold #88C0D0)$character"""

[character]
success_symbol = "[❯](bold #A3BE8C)"
error_symbol = "[❯](bold #BF616A)"

[directory]
style = "bold #88C0D0"
truncation_length = 4
truncate_to_repo = false
truncation_symbol = "…/"
home_symbol = "~"
read_only = " ro"
format = "[·](#4C566A) [$path]($style)[$read_only](#EBCB8B) "

[git_branch]
style = "bold #B48EAD"
format = "[·](#4C566A) [$branch]($style) "

[git_status]
style = "#EBCB8B"
format = "([$all_status$ahead_behind]($style))"
conflicted = "≠"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
up_to_date = ""
untracked = "?"
stashed = ""
modified = "!"
staged = "+"
renamed = ">"
deleted = "x"

[python]
style = "#EBCB8B"
format = "[·](#4C566A) [py $version]($style) "
python_binary = ["python3", "python"]
detect_extensions = ["py"]
detect_files = ["pyproject.toml", "requirements.txt", ".python-version"]

[nodejs]
style = "#A3BE8C"
format = "[·](#4C566A) [node $version]($style) "
detect_files = ["package.json", ".nvmrc"]

[rust]
style = "#EBCB8B"
format = "[·](#4C566A) [rs $version]($style) "
detect_files = ["Cargo.toml"]

[docker_context]
style = "#81A1C1"
format = "[·](#4C566A) [docker]($style) "
only_with_files = true
detect_files = ["docker-compose.yml", "compose.yml", "Dockerfile"]

[kubernetes]
disabled = false
style = "#81A1C1"
format = "[·](#4C566A) [k8s $context]($style) "
detect_files = ["kustomization.yaml", "Chart.yaml"]

[username]
style_user = "bold #B48EAD"
style_root = "bold #BF616A"
format = "[$user]($style)"
show_always = true

[hostname]
ssh_only = false
style = "bold #88C0D0"
format = "[@$hostname]($style)"

[cmd_duration]
min_time = 400
style = "#EBCB8B"
format = "[·](#4C566A) [took $duration]($style) "

[line_break]
disabled = true
