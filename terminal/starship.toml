# Two-line 2026 developer prompt. Starship is the ONLY prompt engine.
# Palette: theme/palette.md (deep dark / cyan / purple)

"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 400
scan_timeout = 30

format = """
[╭─](bold #7dcfff) $username$hostname $directory$git_branch$git_status$python$nodejs$rust$docker_context$kubernetes$cmd_duration
[╰─](bold #7dcfff)$character"""

[character]
success_symbol = "[❯](bold #9ece6a)"
error_symbol = "[❯](bold #f7768e)"

[directory]
style = "bold #7dcfff"
truncation_length = 4
truncate_to_repo = false
truncation_symbol = "…/"
home_symbol = "~"
read_only = " ro"
format = "[·](#565f89) [$path]($style)[$read_only](#e0af68) "

[git_branch]
style = "bold #bb9af7"
format = "[·](#565f89) [$branch]($style) "

[git_status]
style = "#e0af68"
format = "([$all_status$ahead_behind]($style))"
conflicted = "≠"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
up_to_date = ""
untracked = "?"
stashed = ""
modified = "!"
staged = "+"
renamed = ">"
deleted = "x"

[python]
style = "#e0af68"
format = "[·](#565f89) [py $version]($style) "
python_binary = ["python3", "python"]
detect_extensions = ["py"]
detect_files = ["pyproject.toml", "requirements.txt", ".python-version"]

[nodejs]
style = "#9ece6a"
format = "[·](#565f89) [node $version]($style) "
detect_files = ["package.json", ".nvmrc"]

[rust]
style = "#ff9e64"
format = "[·](#565f89) [rs $version]($style) "
detect_files = ["Cargo.toml"]

[docker_context]
style = "#7aa2f7"
format = "[·](#565f89) [docker]($style) "
only_with_files = true
detect_files = ["docker-compose.yml", "compose.yml", "Dockerfile"]

[kubernetes]
disabled = false
style = "#7aa2f7"
format = "[·](#565f89) [k8s $context]($style) "
detect_files = ["kustomization.yaml", "Chart.yaml"]

[username]
style_user = "bold #bb9af7"
style_root = "bold #f7768e"
format = "[$user]($style)"
show_always = true

[hostname]
ssh_only = false
style = "bold #7dcfff"
format = "[@$hostname]($style)"

[cmd_duration]
min_time = 400
style = "#ff9e64"
format = "[·](#565f89) [took $duration]($style) "

[line_break]
disabled = true
