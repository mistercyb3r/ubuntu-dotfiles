# Kitty — the usual “fancy terminal” people use on Linux in 2025–2026.
# Catppuccin Mocha + light transparency + cursor trail.
# https://sw.kovidgoyal.net/kitty/

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Always start zsh (full path so Kitty does not fall back to bash)
shell /usr/bin/zsh

remember_window_size  yes
initial_window_width  120c
initial_window_height 32c
window_padding_width  10
confirm_os_window_close 0
enable_audio_bell     no
copy_on_select        yes
strip_trailing_spaces smart
scrollback_lines      10000
tab_bar_style         fade
tab_fade              0.25 0.5 0.75 1
tab_bar_edge          bottom

# Glass look without a GNOME blur extension (cheaper on Intel iGPU)
background_opacity        0.88
dynamic_background_opacity yes

# Cursor trail — the current popular Kitty effect
cursor_shape              beam
cursor_beam_thickness     1.5
cursor_trail              3
cursor_trail_decay        0.1 0.4

# Catppuccin Mocha
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc
cursor                  #f5e0dc
cursor_text_color       #1e1e2e
url_color               #89b4fa

active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
active_border_color     #cba6f7
inactive_border_color   #313244

color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0
