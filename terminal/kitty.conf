# Kitty — primary workstation terminal.
# Colours from theme/palette.env (do not invent new hex values).

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

shell /usr/bin/zsh
term xterm-256color

remember_window_size  yes
initial_window_width  118c
initial_window_height 34c
window_padding_width  14
confirm_os_window_close 0
enable_audio_bell     no
copy_on_select        clipboard
strip_trailing_spaces smart
scrollback_lines      20000
tab_bar_style         powerline
tab_bar_edge          top
tab_bar_align         left
tab_bar_min_tabs      1
sync_to_monitor       yes

background_opacity         0.94
dynamic_background_opacity yes

cursor_shape           beam
cursor_beam_thickness  1.2
cursor_blink_interval  0

foreground              #D8DEE9
background              #0B0E14
selection_foreground    #D8DEE9
selection_background    #1A2744
cursor                  #7DCFFF
cursor_text_color       #0B0E14
url_color               #7AA2F7

active_tab_foreground   #0B0E14
active_tab_background   #7DCFFF
inactive_tab_foreground #565F89
inactive_tab_background #12161F
active_border_color     #7DCFFF
inactive_border_color   #1C2230

color0  #0B0E14
color1  #F7768E
color2  #9ECE6A
color3  #E0AF68
color4  #7AA2F7
color5  #BB9AF7
color6  #7DCFFF
color7  #D8DEE9
color8  #565F89
color9  #F7768E
color10 #9ECE6A
color11 #E0AF68
color12 #7AA2F7
color13 #BB9AF7
color14 #7DCFFF
color15 #ECEFF4

map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0
