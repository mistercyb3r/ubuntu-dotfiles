# Kitty — primary workstation terminal.
# Palette: theme/palette.md

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

shell /usr/bin/zsh
term xterm-256color

remember_window_size  yes
initial_window_width  118c
initial_window_height 34c
window_padding_width  12
confirm_os_window_close 0
enable_audio_bell     no
copy_on_select        clipboard
strip_trailing_spaces smart
scrollback_lines      20000
tab_bar_style         fade
tab_fade              0.25 0.5 0.75 1
tab_bar_edge          bottom
sync_to_monitor       yes

background_opacity         0.92
dynamic_background_opacity yes

cursor_shape           beam
cursor_beam_thickness  1.4
cursor_trail           2
cursor_trail_decay     0.1 0.35

foreground              #c0caf5
background              #0b0e14
selection_foreground    #0b0e14
selection_background    #7dcfff
cursor                  #7dcfff
cursor_text_color       #0b0e14
url_color               #7aa2f7

active_tab_foreground   #0b0e14
active_tab_background   #7dcfff
inactive_tab_foreground #c0caf5
inactive_tab_background #161821
active_border_color     #7dcfff
inactive_border_color   #1a1b26

color0  #0b0e14
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #c0caf5
color8  #565f89
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #ffffff

map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0
