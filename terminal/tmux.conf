# tmux — colours from theme/palette.env. Prefix stays C-b.

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g history-limit 20000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
set -g status-interval 5
set -g status-keys emacs
setw -g mode-keys vi
set -g default-shell /usr/bin/zsh

set -g status-style "bg=#0B0E14,fg=#D8DEE9"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#0B0E14,bg=#7DCFFF,bold] #S #[fg=#7DCFFF,bg=#0B0E14]"
set -g status-right "#[fg=#565F89]#H #[fg=#BB9AF7]%H:%M "
set -g window-status-format "#[fg=#565F89] #I:#W "
set -g window-status-current-format "#[fg=#0B0E14,bg=#BB9AF7,bold] #I:#W #[fg=#BB9AF7,bg=#0B0E14]"
set -g pane-border-style "fg=#1C2230"
set -g pane-active-border-style "fg=#7DCFFF"
set -g message-style "bg=#12161F,fg=#7DCFFF"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"
