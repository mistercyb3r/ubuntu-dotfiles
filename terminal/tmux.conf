# tmux — colours from theme/palette.env. Prefix stays C-b.

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g history-limit 20000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
set -g status-interval 5
set -g status-keys emacs
setw -g mode-keys vi
set -g default-shell /usr/bin/zsh

set -g status-style "bg=#2E3440,fg=#D8DEE9"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#2E3440,bg=#88C0D0,bold] #S #[fg=#88C0D0,bg=#2E3440]"
set -g status-right "#[fg=#4C566A]#H #[fg=#B48EAD]%H:%M "
set -g window-status-format "#[fg=#4C566A] #I:#W "
set -g window-status-current-format "#[fg=#2E3440,bg=#B48EAD,bold] #I:#W #[fg=#B48EAD,bg=#2E3440]"
set -g pane-border-style "fg=#434C5E"
set -g pane-active-border-style "fg=#88C0D0"
set -g message-style "bg=#3B4252,fg=#88C0D0"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"
