# tmux — same palette as Kitty / Starship. Prefix stays C-b.

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g history-limit 20000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
set -g status-interval 5
set -g status-keys emacs
setw -g mode-keys vi
set -g default-shell /usr/bin/zsh

set -g status-style "bg=#0b0e14,fg=#c0caf5"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#0b0e14,bg=#7dcfff,bold] #S #[fg=#7dcfff,bg=#0b0e14]"
set -g status-right "#[fg=#565f89]#H #[fg=#bb9af7]%H:%M "
set -g window-status-format "#[fg=#565f89] #I:#W "
set -g window-status-current-format "#[fg=#0b0e14,bg=#bb9af7,bold] #I:#W #[fg=#bb9af7,bg=#0b0e14]"
set -g pane-border-style "fg=#565f89"
set -g pane-active-border-style "fg=#7dcfff"
set -g message-style "bg=#161821,fg=#7dcfff"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"
