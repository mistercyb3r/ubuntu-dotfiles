# Slim neofetch config. fastfetch is preferred when installed (faster).
print_info() {
    info title
    info underline
    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "DE" de
    info "WM" wm
    info "Terminal" term
    info "CPU" cpu
    info "Memory" memory
    info "Disk" disk
    info "Battery" battery
    info cols
}

kernel_shorthand="on"
distro_shorthand="off"
os_arch="on"
uptime_shorthand="tiny"
memory_percent="on"
package_managers="on"
shell_version="on"
cpu_speed="on"
cpu_cores="logical"
refresh_rate="off"
gtk_shorthand="on"
stdout="off"
