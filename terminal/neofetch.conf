# Kept simple so older Ubuntu neofetch packages do not error out.
print_info() {
    info title
    info underline
    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "DE" de
    info "WM" wm
    info "Terminal" term
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory
    info "Disk" disk
    info "Battery" battery
    info cols
}

ascii_distro="ubuntu"
color_blocks="on"
bold="on"
os_arch="on"
uptime_shorthand="on"
memory_percent="on"
shell_version="on"
cpu_speed="on"
cpu_cores="logical"
package_managers="on"
stdout="off"
