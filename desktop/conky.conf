-- Nordic desktop stats. Colours from theme/palette.env.
-- GNOME 50 Wayland: X11 output (XWayland). Hyprland can use Wayland.
-- Light: 3s refresh, no Lua, no extra processes.

conky.config = {
  alignment = 'top_right',
  gap_x = 28,
  gap_y = 56,
  minimum_width = 300,
  maximum_width = 300,
  minimum_height = 420,

  update_interval = 3,
  cpu_avg_samples = 2,
  net_avg_samples = 2,
  no_buffers = true,
  double_buffer = true,
  background = false,

  out_to_console = false,
  out_to_stderr = false,
  out_to_x = true,
  out_to_wayland = false,

  own_window = true,
  own_window_type = 'normal',
  own_window_class = 'UbuntuDotfilesConky',
  own_window_title = 'ubuntu-dotfiles-stats',
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  own_window_transparent = false,
  own_window_argb_visual = true,
  own_window_argb_value = 210,
  own_window_colour = '#2E3440',

  border_inner_margin = 18,
  border_outer_margin = 0,
  draw_borders = false,
  draw_graph_borders = true,
  draw_outline = false,
  draw_shades = false,

  use_xft = true,
  font = 'JetBrainsMono Nerd Font:size=10',
  xftalpha = 1,
  uppercase = false,
  override_utf8_locale = true,

  default_color = '#D8DEE9',
  default_outline_color = '#2E3440',
  default_shade_color = '#2E3440',
  color1 = '#88C0D0',
  color2 = '#81A1C1',
  color3 = '#4C566A',
  color4 = '#A3BE8C',
  color5 = '#EBCB8B',
  color6 = '#B48EAD',
  color7 = '#BF616A',

  default_bar_height = 7,
  default_bar_width = 264,
  default_graph_height = 28,
  default_graph_width = 264,
}

conky.text = [[
${color1}${font JetBrainsMono Nerd Font:size=28}${time %H:%M}${font}
${color2}${time %A %-d %b}
${color3}${hr 1}
${color6}${nodename}${color3}  ·  ${color2}${execi 600 lsb_release -ds 2>/dev/null | tr -d '"'}${color}

${color3}cpu${alignr}${color1}${cpu cpu0}%
${color2}${cpubar cpu0}
${color2}${cpugraph cpu0 28,264 81A1C1 88C0D0 -t}

${color3}mem${alignr}${color1}${mem} / ${memmax}
${color2}${membar}

${color3}disk${alignr}${color1}${fs_used /} / ${fs_size /}
${color2}${fs_bar /}

${color3}bat${alignr}${color4}${battery_percent BAT0}% ${battery_short BAT0}
${color4}${battery_bar BAT0}

${color3}temp${alignr}${color5}${acpitemp}°C    ${color3}up${alignr}${color6}${uptime_short}

${color3}${hr 1}
${color3}↓ ${color2}${downspeedf} KiB/s${alignr}${color3}↑ ${color6}${upspeedf} KiB/s
${color2}${downspeedgraph 20,128 81A1C1 88C0D0 -t}${alignr}${color6}${upspeedgraph 20,128 B48EAD 88C0D0 -t}
]]
