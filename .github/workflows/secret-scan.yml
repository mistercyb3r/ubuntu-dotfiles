name: secret-scan

# Lightweight check for accidentally committed secrets.
# This is a safety net, not a complete secret-detection product.

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for obvious secret patterns
        run: bash scripts/check-secrets.sh .
