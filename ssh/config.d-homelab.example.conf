# Copy this file to ~/.ssh/config.d/10-homeserver.conf and replace placeholders.
# This filename ends in .example so Include ~/.ssh/config.d/*.conf will not load it.

# Host homeserver
#     HostName <TAILSCALE_IP_OR_MAGICDNS_NAME>
#     User <USERNAME>
#     IdentityFile ~/.ssh/id_ed25519
#     IdentitiesOnly yes
#     ForwardAgent no
#     # Do not set PasswordAuthentication here in a way that weakens the server.
#     # Do not use port forwarding from the public internet to this laptop.
